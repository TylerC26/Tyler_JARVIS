[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis Personal OS — macOS desktop shell"
authors = ["Tyler"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Slim release binary (kept light so first build isn't glacial)
[profile.release]
opt-level = "s"
strip = true
